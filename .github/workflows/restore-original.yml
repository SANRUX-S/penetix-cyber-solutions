name: Restore Original PENETIX Website

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-original.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract original website ZIP safely
        shell: bash
        run: |
          set -euo pipefail

          ZIP="penetix-website.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Original archive $ZIP was not found."
            exit 1
          fi

          rm -rf /tmp/penetix-original
          mkdir -p /tmp/penetix-original

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          archive = Path("penetix-website.zip")
          out = Path("/tmp/penetix-original").resolve()

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  # The original archive was created on Windows and uses backslashes.
                  raw = info.filename.replace("\\", "/")
                  parts = [p for p in PurePosixPath(raw).parts if p not in ("", ".")]
                  if not parts:
                      continue
                  if any(p == ".." for p in parts):
                      raise RuntimeError(f"Unsafe archive path: {info.filename}")

                  target = out.joinpath(*parts)
                  if info.is_dir() or raw.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, open(target, "wb") as dst:
                      dst.write(src.read())
          PY

          SRC="/tmp/penetix-original"
          shopt -s dotglob nullglob
          entries=(/tmp/penetix-original/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            SRC="${entries[0]}"
          fi

          echo "Restoring from: $SRC"
          echo "Archive contents:"
          find "$SRC" -maxdepth 3 -type f | sort | head -250

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name "penetix-website.zip"             -exec rm -rf {} +

          cp -a "$SRC"/. ./

          test -f penetix-website.zip

      - name: Commit exact restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PENETIX Restore"
          git config user.email "actions@github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Restore original PENETIX website from archived project"
          git push origin HEAD:main
